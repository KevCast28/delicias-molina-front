<app-navbar (cartOpened)="openCart()"/>

<main>
  <router-outlet />
</main>

<app-footer />


  <div
    class="cart-overlay"
    [class.cart-overlay--visible]="isCartOpen"
    (click)="closeCart()"
    aria-hidden="true"></div>

  <app-cart-drawer
    [class.cart-drawer--open]="isCartOpen"
    [attr.inert]="isCartOpen ? null : ''"
    (closed)="closeCart()"/>
